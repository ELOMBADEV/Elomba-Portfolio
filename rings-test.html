<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Reminder Rings</title>
    <style>
        body {
            background-color: #0A1128; /* Deep Midnight Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .ring-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(#0A1128, #0A1128) padding-box,
                        linear-gradient(45deg, #FFC300, #FFD700, #FF8C00) border-box;
        }

        .ring1 {
            width: 100%;
            height: 100%;
            animation: swing 3s infinite ease-in-out alternate;
        }

        .ring2 {
            width: 75%;
            height: 75%;
            animation: swing 2.5s infinite ease-in-out alternate-reverse;
            opacity: 0.8;
        }

        .ring3 {
            width: 50%;
            height: 50%;
            animation: swing 2s infinite ease-in-out alternate;
            opacity: 0.6;
            box-shadow: 0 0 20px rgba(255, 195, 0, 0.5);
        }

        /* This is the magic that makes it look like it's reacting */
        @keyframes swing {
            0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 10px rgba(255, 195, 0, 0.2); }
            50% { transform: scale(1.05) rotate(10deg); box-shadow: 0 0 30px rgba(255, 195, 0, 0.6); }
            100% { transform: scale(1) rotate(0deg); box-shadow: 0 0 10px rgba(255, 195, 0, 0.2); }
        }

    </style>
</head>
<body>

    <div class="ring-container">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>
    </div>

</body>
</html>
